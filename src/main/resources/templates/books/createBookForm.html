<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Create Book</title>
</head>
<body>
<div class="container">
    <form action="/books/new" method="post">
        <div class="form-group">
            <label for="user_id">작성자</label>
            <input type="text" id="user_id" name="user_id" placeholder="작성자를 입력하세요">
            <label for="title">제목</label>
            <input type="text" id="title" name="title" placeholder="제목을 입력하세요">
            <label for="description">설명글</label>
            <input type="text" id="description" name="description" placeholder="설명글을 입력하세요">
            <label for="author">작가</label>
            <input type="text" id="author" name="author" placeholder="작가를 입력하세요">
            <label for="publisher">출판사</label>
            <input type="text" id="publisher" name="publisher" placeholder="출판사를 입력하세요">
            <label for="published_date">출판년도</label>
            <input type="date" id="published_date" name="published_date" placeholder="출판년도를 입력하세요">
        </div>
        <button type="submit">등록</button>
    </form>
</div> <!-- /container -->
</body>
</html>
