<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book List</title>
</head>
<body>
<table>
  <thead>
  <tr>
    <th>도서 제목</th>
    <th>작가</th>
    <th>출판사</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="book : ${books}">
    <td>
      <a th:href="@{/books/{id}(id=${book.book_id})}" th:text="${book.title}">제목</a>
    </td>
    <td th:text="${book.author}">작가</td>
    <td th:text="${book.publisher}">출판사</td>
  </tr>
  </tbody>
</table>
</body>
</html>
